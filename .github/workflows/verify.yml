name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.3

      - name: Install dependencies
        run: npm ci

      - name: Check dependency topology
        run: npm run check:dependency-topology

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Audit frozen Edge dependencies
        run: npm run audit:edge

      - name: Install browser matrix
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Verify application
        run: npm run verify
        env:
          BROWSER_LIBRARY_REQUIRE_FULL_MATRIX: '1'

      - name: Build application
        run: npm run build
        env:
          SUPABASE_URL: https://config.test.invalid
          SUPABASE_ANON_KEY: test-public-anon-key

      - name: Check built browser security headers
        run: npm run check:security-headers

      - name: Check client bundle budget
        run: npm run check:client-bundle-budget

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx --no-install supabase start

      - name: Test database
        run: npm run test:db

      - name: Compare generated types with migrated schema
        run: npm run check:database-schema-types

      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
