name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify recovery safeguards without credentials
        run: node --test scripts/recovery-core.test.mjs scripts/recovery-storage.test.mjs scripts/recovery-operations.test.mjs scripts/recovery-notification.test.mjs

      - name: Install the isolated recovery CLI without credentials
        run: npm ci --prefix tooling/recovery

      - name: Audit the isolated recovery toolchain
        run: npm audit --prefix tooling/recovery --audit-level=high

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Audit frozen Edge dependencies
        run: npm run audit:edge

      - name: Verify formatting, types, Edge and tooling contracts
        run: npm run verify:static

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright image ships Chromium, Firefox and WebKit with their system
    # packages, so the job never waits on an Ubuntu package mirror. Its version
    # must match the locked playwright package (check:dependency-topology).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application, E2E and browser matrix
        run: npm run verify:app
        env:
          BROWSER_LIBRARY_REQUIRE_FULL_MATRIX: '1'
          LOCAL_AUDIO_CACHE_REQUIRE_TIMING_BUDGETS: '0'

      - name: Build application
        run: npm run build
        env:
          SUPABASE_URL: https://config.test.invalid
          SUPABASE_ANON_KEY: test-public-anon-key

      - name: Check built browser security headers
        run: npm run check:security-headers

      - name: Check client bundle budget
        run: npm run check:client-bundle-budget

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx --no-install supabase start

      - name: Test database
        run: npm run test:db

      - name: Compare generated types with migrated schema
        run: npm run check:database-schema-types

      - name: Install integration browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Test application against local Supabase
        run: npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
