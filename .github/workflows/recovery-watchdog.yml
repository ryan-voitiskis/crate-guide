name: Independent recovery watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  freshness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crate-guide-recovery-health
      cancel-in-progress: false
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - name: Check the last successful capture and notify on staleness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/recovery-notification.mjs watchdog
